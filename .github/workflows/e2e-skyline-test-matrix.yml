---
name: E2E Skyline Tests (Matrix)
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - milos-ethernal-patch-1
  workflow_call:
    inputs:
      e2e_apex_skip_redundant_tests:
        description: E2E Skyline Skip Redundant Tests
        type: string
        required: true
      apex_bridge_ref:
        description: The branch/commit from the Apex Bridge
        type: string
        required: true
      blade_apex_bridge_ref:
        description: The branch/commit from the Blade Apex Bridge
        type: string
        required: true
    outputs:
      workflow_output:
        description: E2E Skyline Tests output
        value: ${{ jobs.test_summary.outputs.e2e_skyline_output_failure }}
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      e2e_apex_skip_redundant_tests:
        description: E2E Skyline Skip Redundant Tests
        type: string
        required: true
        default: "false"
      apex_bridge_ref:
        description: The branch/commit from the Apex Bridge
        type: string
        required: true
        default: "feat/skyline"
      blade_apex_bridge_ref:
        description: The branch/commit from the Blade Apex Bridge
        type: string
        required: true
        default: "feat/skyline"
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      blade_binary: ${{ steps.build.outputs.blade_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.blade_apex_bridge_ref || github.ref_name }}
      - name: Install Go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: ${{ vars.GOLANG_VERSION }}
          check-latest: true
      - name: Generate OpenSSL certificate
        run: openssl req -x509 -out localhost.crt -keyout localhost.key -newkey rsa:2048 -nodes -sha256 -subj '/CN=localhost' -extensions EXT -config <(printf "[dn]\nCN=localhost\n[req]\ndistinguished_name = dn\n[EXT]\nsubjectAltName=DNS:localhost\nkeyUsage=digitalSignature\nextendedKeyUsage=serverAuth")
      - name: Copy certificate key
        run: sudo cp localhost.key /etc/ssl/private/localhost.key
      - name: Copy certificate itself
        run: sudo cp localhost.crt /usr/local/share/ca-certificates/localhost.crt
      - name: Add certificate to trusted list
        run: sudo update-ca-certificates
      - name: Update certificate key folder permissions
        run: sudo chmod -R 755 /etc/ssl/private
      - name: Update certificate key file permissions
        run: sudo chmod 644 /etc/ssl/private/localhost.key
      - name: Install Cardano tools
        uses: milos-ethernal/cardano-node-action@5a3bce7266cc1500d96e8fa63b3bb97135988482
      - name: Install ogmios
        uses: milos-ethernal/ogmios-action@13e2be0b00da80f26bb8583fa129bd7c08856a49
      - name: Checkout apex-bridge repo
        uses: actions/checkout@v4.1.1
        with:
          repository: Ethernal-Tech/apex-bridge
          ref: ${{ inputs.apex_bridge_ref || 'feat/skyline' }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Build apex-bridge
        run: |
          go build -tags testenv
          sudo mv apex-bridge /usr/local/bin/
      - name: Verify apex-bridge executable
        run: apex-bridge --help
      - name: Checkout blade
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.blade_apex_bridge_ref }}
          submodules: recursive
      - name: Build blade binary
        id: build
        run: |
          go build -o artifacts/blade .
          echo "blade_path=${PWD}/artifacts/blade" >> $GITHUB_OUTPUT
      - name: Check certificate key permissions
        run: ls -l /etc/ssl/private/localhost.key

  test_fund_defund:
    name: Test Fund_Defund
    runs-on: ubuntu-latest
    needs: setup
    env:
      E2E_TESTS: true
      E2E_LOGS: true
      CI_VERBOSE: true
    outputs:
      test_result: ${{ steps.test_result.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.blade_apex_bridge_ref || github.ref_name }}
      - name: Install Go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: ${{ vars.GOLANG_VERSION }}
          check-latest: true
      - name: Copy blade binary from setup
        run: |
          mkdir -p artifacts
          cp ${{ needs.setup.outputs.blade_binary }} artifacts/blade
      - name: Run Fund_Defund test
        id: test_result
        run: |
          if EDGE_BINARY=${PWD}/artifacts/blade E2E_TESTS=true E2E_LOGS=true \
          go test -v -timeout=2h ./e2e-polybft/e2e/... -run "^TestE2E_SkylineBridge_Fund_Defund$"; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
          fi
        env: 
          SKIP_E2E_REDUNDANT_TESTS: ${{ inputs.e2e_apex_skip_redundant_tests || 'false' }}

  test_valid_scenarios:
    name: Test ValidScenarios
    runs-on: ubuntu-latest
    needs: setup
    env:
      E2E_TESTS: true
      E2E_LOGS: true
      CI_VERBOSE: true
    outputs:
      test_result: ${{ steps.test_result.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.blade_apex_bridge_ref || github.ref_name }}
      - name: Install Go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: ${{ vars.GOLANG_VERSION }}
          check-latest: true
      - name: Copy blade binary from setup
        run: |
          mkdir -p artifacts
          cp ${{ needs.setup.outputs.blade_binary }} artifacts/blade
      - name: Run ValidScenarios test
        id: test_result
        run: |
          if EDGE_BINARY=${PWD}/artifacts/blade E2E_TESTS=true E2E_LOGS=true \
          go test -v -timeout=2h ./e2e-polybft/e2e/... -run "^TestE2E_SkylineBridge_ValidScenarios$"; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
          fi
        env: 
          SKIP_E2E_REDUNDANT_TESTS: ${{ inputs.e2e_apex_skip_redundant_tests || 'false' }}

  test_remaining:
    name: Test Remaining SkylineBridge Tests
    runs-on: ubuntu-latest
    needs: setup
    env:
      E2E_TESTS: true
      E2E_LOGS: true
      CI_VERBOSE: true
    outputs:
      test_result: ${{ steps.test_result.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.blade_apex_bridge_ref || github.ref_name }}
      - name: Install Go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: ${{ vars.GOLANG_VERSION }}
          check-latest: true
      - name: Copy blade binary from setup
        run: |
          mkdir -p artifacts
          cp ${{ needs.setup.outputs.blade_binary }} artifacts/blade
      - name: Run remaining tests
        id: test_result
        run: |
          # Run all SkylineBridge tests except the long-running ones
          if EDGE_BINARY=${PWD}/artifacts/blade E2E_TESTS=true E2E_LOGS=true \
          go test -v -timeout=2h ./e2e-polybft/e2e/... -run "^TestE2E_SkylineBridge_" \
          -skip "TestE2E_SkylineBridge_Fund_Defund|TestE2E_SkylineBridge_ValidScenarios"; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
          fi
        env: 
          SKIP_E2E_REDUNDANT_TESTS: ${{ inputs.e2e_apex_skip_redundant_tests || 'false' }}

  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test_fund_defund, test_valid_scenarios, test_remaining]
    if: always()
    outputs:
      e2e_skyline_output_failure: ${{ steps.summary.outputs.overall_result }}
    steps:
      - name: Check test results
        id: summary
        run: |
          fund_result="${{ needs.test_fund_defund.result }}"
          valid_result="${{ needs.test_valid_scenarios.result }}"
          remaining_result="${{ needs.test_remaining.result }}"
          
          echo "Fund_Defund result: $fund_result"
          echo "ValidScenarios result: $valid_result"
          echo "Remaining tests result: $remaining_result"
          
          if [[ "$fund_result" == "success" && "$valid_result" == "success" && "$remaining_result" == "success" ]]; then
            echo "overall_result=success" >> $GITHUB_OUTPUT
            echo "All tests passed!"
          else
            echo "overall_result=failure" >> $GITHUB_OUTPUT
            echo "Some tests failed!"
            exit 1
          fi

